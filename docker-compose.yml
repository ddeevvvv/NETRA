version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ibvap_postgres
    restart: always
    environment:
      POSTGRES_USER: ibvap_user
      POSTGRES_PASSWORD: ibvap_password
      POSTGRES_DB: ibvap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibvap_user -d ibvap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ibvap_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ibvap_mediamtx
    restart: always
    ports:
      - "8554:8554"   # RTSP TCP/UDP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ibvap_backend
    restart: always
    volumes:
      - ./backend:/app
      - ./scripts/camera_feeds:/feeds:ro
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ibvap_user:ibvap_password@postgres:5432/ibvap_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - NIGHT_MOVEMENT_ENABLED=true
      - NIGHT_BRIGHTNESS_THRESHOLD=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibvap_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
